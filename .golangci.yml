# goxsd5 lint config (golangci-lint v1). Run: golangci-lint run
# The mechanical style gate — formatting, imports, and obvious-bug linters.
# Taste/architecture rules that tools can't check live in CONVENTIONS.md.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - gofmt        # canonical formatting (Fmt)
    - goimports    # import grouping + ordering
    - govet        # suspicious constructs
    - staticcheck  # the big correctness/simplification linter
    - unused       # dead code
    - ineffassign  # ineffectual assignments
    - errcheck     # unchecked errors
    - unconvert    # redundant conversions
    - misspell     # comment/string typos
    - revive       # style: naming, exported-doc, early-return nudges
    - gocognit     # cognitive complexity — flags functions that need splitting

linters-settings:
  goimports:
    local-prefixes: github.com/kud360/goxsd5
  gocognit:
    # Cognitive-complexity ceiling per function. 30 is the conventional default;
    # tune up if the parser/validator's genuinely-complex routines flood it, or
    # down to ratchet complexity tighter over time.
    min-complexity: 30
  revive:
    rules:
      - name: early-return        # nudges happy-path-left / avoid-else
      - name: indent-error-flow
      - name: exported            # exported symbols want doc comments

issues:
  # Don't hide repeat offenders — we want every finding while ratcheting quality.
  max-issues-per-linter: 0
  max-same-issues: 0
