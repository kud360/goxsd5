version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocognit
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gocognit:
      # Cognitive-complexity ceiling per function. Conventional defaults are 30
      # (gocognit) / 15 (SonarSource), but this is a spec-driven parser/validator
      # where rule-tables and dispatch are inherently complex: 15-20 would flag
      # ~50-105 functions, forcing churn that scatters cohesive algorithms.
      # 30 isolates the genuinely-unmaintainable outliers from the long tail of
      # complex-but-readable routines. RATCHET INTENT: this reached the target
      # floor of 30 (was 40, was 50) -- the descending counterpart to the
      # conformance baseline. Hold it here; do not raise. The ceiling applies to
      # production code only: test harnesses and tools/docscleaner (one-shot doc
      # tooling, not shipped) are excluded below.
      min-complexity: 30
    revive:
      rules:
        - name: early-return
        - name: indent-error-flow
        - name: exported
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # The gocognit ceiling pins *production* complexity. Test harnesses
      # (table-driven suite drivers) and tools/docscleaner (one-shot doc
      # tooling, not shipped) are intentionally exempt -- all other linters
      # still apply to them.
      - linters:
          - gocognit
        path: (_test\.go|tools/docscleaner/)
    paths:
      - third_party$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kud360/goxsd5
  exclusions:
    generated: lax
    paths:
      - third_party$
      - examples$
