version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocognit
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gocognit:
      # Cognitive-complexity ceiling per function. Conventional defaults are 30
      # (gocognit) / 15 (SonarSource), but this is a spec-driven parser/validator
      # where rule-tables and dispatch are inherently complex: 15-20 would flag
      # ~50-105 functions, forcing churn that scatters cohesive algorithms.
      # 40 isolates the genuinely-unmaintainable outliers (>40) from the long
      # tail of complex-but-readable routines (~30-40). RATCHET INTENT: lower
      # this toward 30 as functions are simplified -- like the conformance
      # baseline, but descending. Floor: 40 (was 50); next target: 30.
      min-complexity: 40
    revive:
      rules:
        - name: early-return
        - name: indent-error-flow
        - name: exported
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kud360/goxsd5
  exclusions:
    generated: lax
    paths:
      - third_party$
      - examples$
